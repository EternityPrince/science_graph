[project]
name = "science-graph-root"
version = "0.1.0"
description = "Science Graph Root Workspace"
requires-python = ">=3.12"
dependencies = [
    "graph",
]

[project.scripts]
graph = "src.cli:app"

[tool.uv]
workspace = { members = ["back"] }
sources = { graph = { workspace = true } }
override-dependencies = [
    "transformers>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["back/tests"]
pythonpath = ["back"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:marker.settings",
    "ignore:Support for class-based `config` is deprecated:DeprecationWarning:texify.settings",
]
markers = [
    "llm: tests that require heavy LLM models, external LLM APIs, or slow model initialization",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []


