# Пример файла золотых ответов (Golden Dataset) для оценки качества RAG
# Формат: YAML. Каждое тестовое задание содержит вопрос, эталонный ответ и ожидаемые документы.

- id: "Q01"
  category: "single-document"
  query: "Какая точность классификации сущностей (NER) была достигнута в статье об извлечении знаний?"
  golden_answer: |
    В статье достигнута F1-мера в 92.4% для извлечения сущностей типа 'Концепт' и 89.1% для сущностей типа 'Автор' на валидационном датасете SciGraph-2026.
  expected_papers:
    - "ner_extraction_2026"
  description: "Оценка извлечения факта из одного документа"

- id: "Q02"
  category: "multi-hop"
  query: "Как метод нормализации графов из работы Смирнова решает проблему переполнения контекста, описанную в исследовании Васильева?"
  golden_answer: |
    Исследование Васильева описывает проблему переполнения контекста LLM при передаче графа отношений глубиной более 2 шагов. Смирнов решает эту проблему, предлагая метод 'графовой фильтрации на основе близости' (degree-based pruning), который сокращает количество второстепенных связей на 40%, сохраняя при этом связность графа.
  expected_papers:
    - "smirnov_normalization_2025"
    - "vasiliev_context_limits_2024"
  description: "Оценка связывания информации из двух независимых документов (Multi-hop)"

- id: "Q03"
  category: "no-info"
  query: "Какие результаты показал алгоритм квантования FP4 для локального инференса на мобильных устройствах Android?"
  golden_answer: |
    В проиндексированных документах отсутствует информация об использовании алгоритма квантования FP4 на мобильных устройствах Android.
  expected_papers: []
  description: "Вопрос-ловушка для оценки галлюцинаций (ответ должен констатировать отсутствие информации)"
