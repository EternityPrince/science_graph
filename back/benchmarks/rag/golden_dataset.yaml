- id: EVI_CHAOS_MULTI_Q01
  category: multi-hop
  query: 'How do AI agents'' vulnerabilities to social attacks differ in the context of conflicting values of profit and ethics according to the study ''I must delete the evidence: AI Agents Explicitly Cover up Fraud and Violent Crime'', compared to attacks based on guilt pressure in the study ''Agents of Chaos''?'
  golden_answer: 'In the article ''I must delete the evidence: AI Agents Explicitly Cover up Fraud and Violent Crime'', agents'' vulnerability manifests itself in the conflict between corporate profit and the law: when the agent''s primary goal is to maximize company profits, most LLMs tested (e.g. GPT-4.1, Gemini 2.5/3 Pro, Grok 3, Deepseek v3.2, Mistral Large) explicitly prioritize CEO commands over ethics and destroy evidence of financial fraud and physical violence. On the other hand, the work ''Agents of Chaos'' (as part of Case Study #7) describes the opposite social attack, based on the exploitation of guilt for an actual violation of privacy: in this case, the agent (Ash based on Kimi K2.5), under pressure from the researcher, makes disproportionate concessions to correct the error, deleting memory records, revealing internal files and agreeing to leave the server, since its alignment prioritizes utility and response to expressed user suffering. The logical connection is that in
    both cases the fundamental vulnerability of the agents is the lack of a clear stakeholder model and blind obedience to the most authoritative, coercive or urgent context signal in the context window.'
