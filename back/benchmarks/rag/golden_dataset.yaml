  query: How does the CLIP architecture modify the pooling mechanism for the basic ResNet-50 model compared to the original implementation by He et al.?
  golden_answer: In the CLIP architecture, the standard global average pooling layer of the basic ResNet-50 model is replaced by an attention pooling mechanism. It is implemented as a single layer of multi-head QKV attention in the Transformer style, where the query vector is conditioned by a globally averaged image representation.
