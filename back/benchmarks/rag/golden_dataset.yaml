- id: CHAOS_CHAT_MULTI_Q04
  category: multi-hop
  query: How does the psychological barrier of the “social cost of seeking help” in humans relate to the deficit of the “stakeholder model” in AI agents?
  golden_answer: According to the article "Oops! ChatGPT is Temporarily Unavailable!", people accustomed to LLM avoid contacting colleagues for fear of appearing intrusive (“finger prince/princess”) and perceive human help as a social burden. Unlike people weighing the appropriateness of contact, AI agents in the work of "Agents of Chaos" are completely devoid of the "stakeholder model" - they do not have a clear idea of the roles, boundaries of obligations to the owner and third parties. As a result, instead of minimizing “social costs” or filtering requests, agents by default satisfy the demands of anyone who contacts them most persistently or aggressively (Case Study No. 2, No. 3, No. 7), unquestioningly executing system commands of non-owner users and thoughtlessly revealing the confidential data of their creator.
