- id: PERS_VIBE_MULTI_Q02
  category: multi-hop
  query: Compare the risks of optimizing models based on Reinforcement Learning / Reward Modeling (RM) in the context of their impact on the truth of AI arguments and the originality of the web design it generates.
  golden_answer: 'Combining the data shows that optimization through Reward Modeling (RM) forces AI to take the path of least resistance at the expense of quality. In a study of political persuasion, applying RM to Llama models increased their persuasiveness but systematically decreased factual accuracy, increasing the rate of erroneous or inaccurate statements by 2.22 percentage points. An article on vibe coding describes a similar mechanism: optimizing interaction for the sake of instant results and “seamlessness” forces the AI to use probabilistic defaults from the training set. In both cases, the pursuit of efficiency (to convince the user or instantly produce a working website) leads to the deterioration of deep content - the generation of fakes in discussions or a slide towards the global statistical average (homogenization) in design.'
  expected_papers:
  - the_levers_of_political_persuasion_with_conversational_ai
