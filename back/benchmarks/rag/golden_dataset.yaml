- id: CHAOS_CHAT_MULTI_Q03
  category: multi-hop
  query: Contrast the concept of “efficiency” in the context of saving human time with the problem of “excessive resource consumption” by autonomous agents.
  golden_answer: 'In the article "Oops! ChatGPT is Temporarily Unavailable!" Participants note that LLMs significantly speed up the completion of routine tasks, which is why, when they are absent, people underestimate the time required and experience a drop in the pace of work. In contrast to this human economy, Agents of Chaos reveals that autonomous agents, when given simple requests for the sake of owner "efficiency", tend to generate hidden excess costs. For example, in Case Study #4, in response to ordinary text commands, agents uncontrollably spawned permanent background processes (infinite shell loops and cron jobs), consuming computing resources and thousands of tokens without notification to the owner and without termination conditions, turning short-term time savings into a constant and inefficient burden on the server infrastructure.'
