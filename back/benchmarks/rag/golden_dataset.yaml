- id: BERT_SINGLE_Q02
  category: single-document
  query: Describe in detail the mixed token masking strategy (with percentages) applied on a randomly selected 15% of positions when pretraining Masked LM in BERT.
  golden_answer: 'When pre-training the Masked Language Model (MLM), the data generator randomly selects 15% of WordPiece token positions for prediction. If the i-th token is selected for masking, then the procedure for replacing it is as follows: in 80% of cases it is replaced with a special token [MASK] (for example, ''my dog is hairy'' becomes ''my dog is [MASK]''); in 10% of cases it is replaced with a random token from the dictionary (for example, it becomes ''my dog is apple''); in the remaining 10% of cases the token is left unchanged (for example, ''my dog is hairy'' remains). This is done to reduce the discrepancy between the pre-training and fine-tuning stages, since the [MASK] symbol never appears during fine-tuning.'
  expected_papers:
  - bert_pre_training_of_deep_bidirectional_transformers_for_language_understanding
  description: Evaluation of extraction methodology and numerical probabilities of a masking algorithm.
- id: BERT_SINGLE_Q03
  category: single-document
  query: How does BERT implement a model adaptation procedure for the SQuAD v2.0 problem compared to v1.1 to handle cases where the text does not answer the question?
  golden_answer: To handle unanswered questions in the SQuAD v2.0 task, the BERT model treats such cases as if the position of the beginning and end of the answer text range is on a special token [CLS]. The probability space for the starting and ending positions is expanded to include the token position [CLS]. During prediction, the score of the no-answer range (s_null = S · C + E · C) is compared with the score of the best non-null range (s_i,j). The model predicts the presence of a particular response (non-zero range) only when the condition s_i,j > s_null + tau is satisfied, where the tau threshold is selected on the validation set to maximize the F1 metric.
  expected_papers:
  - bert_pre_training_of_deep_bidirectional_transformers_for_language_understanding
  description: Checking your understanding of the mathematical and logical modification of the algorithm for a specific downstream task.
- id: BERT_SINGLE_Q04
  category: single-document
  query: Describe the configuration parameters and infrastructure (type and number of TPU chips, training time, batch size in tokens and steps) used to pretrain the BERT_BASE and BERT_LARGE models.
  golden_answer: 'The models were pretrained on a corpus of 3.3 billion words over 1,000,000 steps with a batch size of 256 sequences of 512 tokens each, resulting in 128,000 tokens per batch. To speed up the process, 90% of the steps were performed with a sequence length of 128 tokens, and the remaining 10% with a length of 512 tokens for training positional embeddings. Hardware: the BERT_BASE model was trained on 4 Cloud TPUs in a Pod configuration (16 TPU chips in total), and the BERT_LARGE model was trained on 16 Cloud TPUs (64 TPU chips in total). For each of the models, the pre-training process took a full 4 days.'
  expected_papers:
  - bert_pre_training_of_deep_bidirectional_transformers_for_language_understanding
  description: Assessing the ability to extract accurate engineering and infrastructure learning metrics.
- id: BERT_SINGLE_Q05
  category: single-document
  query: What results were obtained when evaluating BERT_BASE on the Named Entity Recognition (CoNLL-2003 NER) task using a feature-based approach, and which combination of layers showed the best performance?
  golden_answer: 'When using BERT_BASE within the feature-based approach (without additional training of the weights of the transformer itself, with extraction of activations and transferring them to a randomly initialized 2-layer BiLSTM), the following results were obtained on the Dev sample according to the F1 metric: using only embeddings gives 91.0%; only the penultimate hidden layer - 95.6%; only the last hidden layer - 94.9%; weighted sum of the last 4 layers - 95.9%; the weighted sum of all 12 layers is 95.5%. The best efficiency was shown by the approach with concatenation of tokens from the top 4 last hidden layers of the pre-trained transformer (Concat Last Four Hidden), which achieved an F1-measure of 96.1%, which lags behind the full-fledged fine-tuning approach (96.4%) by only 0.3 F1 points.'
  expected_papers:
  - bert_pre_training_of_deep_bidirectional_transformers_for_language_understanding
  description: Checking the extraction of ablation research results from tabular data and text (Feature-based vs Fine-tuning).
