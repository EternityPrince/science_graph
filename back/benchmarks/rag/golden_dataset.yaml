- id: POLY_SINGLE_Q01
  category: single-document
  query: What mathematical relationship is postulated in the Linearity Assertion for embedding a polysemous word through its individual meanings, and how are the coefficients of this combination determined?
  golden_answer: 'According to the Linearity Assertion, the embedding of a polysemous word (for example, $v_{tie}$ ) is a linear superposition of the hypothetical embeddings of its individual monosemic meanings ( $u_{tie1}$ , $v_{tie2}$ , etc.), which would be obtained by manually marking contexts in the corpus: $v_{tie} \approx \alpha_1 u_{tie1} + \alpha_2 v_{tie2} + \alpha_3 v_{tie3} + \dots$ . The weighting coefficients $\alpha_i$ are non-negative and are calculated as shares of the frequency of occurrence of a particular value in the corpus: $\alpha = \frac{f_1}{f_1 + f_2}$ and $\beta = \frac{f_2}{f_1 + f_2}$ , where $f_1$ and $f_2$ are the number of mentions of the corresponding values $s_1$ and $s_2$ .'
  expected_papers:
  - arxiv160103764v6_cscl_7_dec_2018
  description: Assessing the extraction of precise mathematical formulation and variable definitions from article text.
- id: POLY_SINGLE_Q02
  category: single-document
  query: What is the modification of the discourse random walk model (Arora et al., 2016) proposed by the authors, and what empirical clustering problem does it solve?
  golden_answer: The authors replaced the original unit sphere random walk model with a Gaussian random walk model, where the discourse vector $c$ is drawn from a Gaussian distribution with zero mean and covariance $\Sigma$ , which allows the norm of the discourse vectors to differ from 1. This change theoretically justifies the need to apply a non-identical linear transformation $A = n(\Sigma^{-1}+2I)(\Sigma^{-1}+2nI)^{-1}$ to context vectors. This modification addresses the problem of classical clustering approaches (e.g., Reisinger and Mooney, 2010), in which the closest words to the cluster center were often found to be semantically meaningless for a particular meaning; applying the $A$ matrix to the cluster centers returns their meaningful meaning, smoothing out the spectrum of frequency words.
  expected_papers:
  - arxiv160103764v6_cscl_7_dec_2018
  description: Test your understanding of the methodological differences between the basic and modified models and their practical implications.
- id: POLY_SINGLE_Q03
  category: single-document
  query: What are the optimal hyperparameters (sparsity k and number of atoms m) for the k-SVD sparse encoding algorithm found through experiments, and how do the authors justify a fixed choice of k?
  golden_answer: In experiments using the k-SVD algorithm, the best parameters were found to be sparsity $k = 5$ (maximum number of values per word) and number of discourse atoms $m \approx 2000$ . The authors justify the fixed choice of $k=5$ (instead of the dynamic $k$ that correlates with word frequency) by the fact that low-dimensional embeddings do not store any information from the corpus other than the vectors themselves. If you allow too many non-zero $\alpha_{w,j}$ coefficients, the sum of their squares will be limited to the value of $\approx ||v_w||_2^2$ , which will inevitably cause some of the coefficients to become small and the algorithm will begin to highlight noisy or semantically meaningless atoms instead of the actual word meanings.
  expected_papers:
  - arxiv160103764v6_cscl_7_dec_2018
  description: Evaluation of the extraction of specific experimental parameters and the theoretical justification of the model configuration.
- id: POLY_SINGLE_Q04
  category: single-document
  query: Describe the methodology of the quantitative 'Police Lineup' test for word sense induction (WSI) systems and the results of comparing the proposed method with human performance.
  golden_answer: The 'Police Lineup' test uses 200 polysemous words and their 704 meanings from WordNet, where each meaning is represented by 8 relevant words from definitions and examples. During the test, one polysemous word is randomly selected, its true meanings are taken, and random distractor senses from other words are added to them to create a total of $n$ meanings. The job of the algorithm or human is to identify the true meanings of the word in this set. With the parameters $n=20$ and $t=4$ (issued number of values), the method proposed by the authors showed accuracy (precision) of 65% and recall (recall) of 75%, demonstrating results comparable to those of people for whom English is not their native language (non-native speakers with 7–10 years of learning experience).
  expected_papers:
  - arxiv160103764v6_cscl_7_dec_2018
  description: Testing the ability to extract details of experimental metrics and a comprehensive description of a custom benchmark.
- id: POLY_SINGLE_Q05
  category: single-document
  query: What results were obtained when assessing the cosine proximity between word vectors from the SemEval 2010 problem and the subspace formed by their value vectors for the GloVe, skip-gram and SN models?
  golden_answer: 'In the experiment (Test 2), which serves as a proxy test of the Linear Assertion on polysemic words from the WSI SemEval 2010 task, the average cosine proximity (proximity of the angle) between the original vectors of words and the subspace spanned by the vectors of their values (generated through SIF embedding of WordNet texts and linear transformation) was: 0.72 for GloVe, 0.73 for skip-gram (word2vec variant) and 0.76 for the SN model (Arora et al., 2016). This proves that word vectors lie close to the subspace of their values, which meaningfully confirms the theory of linear superposition.'
  expected_papers:
