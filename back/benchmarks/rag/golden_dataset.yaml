  description: Verification of extraction of accurate metrics from summary tables of hypothesis validation results (Table 4).
- id: DS_KAMI_MULTI_Q01
  category: multi-hop
  query: How do the results of Kamiwaza AI's large-scale hallucination research compare to the DeepSeek-R1 and DeepSeek-R1-Zero model training approaches, and what common critical flaw of modern LLMs do both papers highlight?
  golden_answer: 'In a study by Kamiwaza AI using the RIKER methodology, it was found that the ability to ground and resistance to fabrication of facts are fundamentally different qualities: the Llama 3.1 70B model demonstrates an extraction accuracy of 89.95%, but fabricates non-existent facts in 53.04% of cases. This finding directly explains the logic of the DeepSeek-R1 developers: they abandoned standard SFT training before RL for DeepSeek-R1-Zero, arguing that human demonstrations hide critical elements of reasoning such as explicit reflection and verification (self-correction/return to previous steps). It is the absence of these cognitive mechanisms in traditional models (which, as Kamiwaza AI points out, generate answers directly without intermediate steps) that prevents traditional scaling methods such as majority voting from overcoming the hallucination barrier, since they simply extract the same faulty logic multiple times. A common critical weakness recognized in both works is
    the inability of current models to effectively use external tools (such as search engines, calculators, or compilers for real-time validation of results) at their current stage of development.'
  expected_papers:
  - deepseek_r1_incentivizing_reasoning_capability_in_llms_via_reinforcement_learning
  - how_much_do_llms_hallucinate_in_document_qa_scenarios_a_172_billion_token_study_across_temperatures_context_lengths_and_hardware_platforms
  description: Evaluation of the connection between the necessity of internal reasoning mechanisms and empirical metrics of fact fabrication vs. grounding
- id: DS_KAMI_MULTI_Q02
  category: multi-hop
  query: How do the architectural features of Mixture-of-Experts (MoE) models mentioned in the context of DeepSeek-R1 and the Kamiwaza AI study affect computational efficiency and response accuracy when processing long context?
  golden_answer: 'According to a study by Kamiwaza AI, models based on the MoE architecture with a small number of active parameters (for example, Qwen3 Next 80B-A3B and Qwen3 30B-A3B) exhibit the phenomenon of “graceful degradation” in scenarios with long context: Qwen3 Next 80B-A3B loses only 11.19 percentage points of accuracy when moving from 32K to 200K context and maintains the level of fabrication of facts by at 11.21%. Kamiwaza AI suggests that MoE routing provides the advantage of maintaining factual accuracy over long contexts. On the infrastructure side, the developers of DeepSeek-R1 (the model uses 671B of shared parameters and 37B of active parameters per token) explain exactly how computational efficiency is achieved in such MoE systems: they use expert parallelism strategy between compute nodes to reduce memory latency, deploy redundant copies of highly requested experts (hotspot experts) to balance the load, and use the Multi-Token Prediction (MTP) component to speed up the
    decoding of long sequences.'
  expected_papers:
  - deepseek_r1_incentivizing_reasoning_capability_in_llms_via_reinforcement_learning
  - how_much_do_llms_hallucinate_in_document_qa_scenarios_a_172_billion_token_study_across_temperatures_context_lengths_and_hardware_platforms
