  description: Assessing the linking of information from two independent documents (Multi-hop)
- id: PERS_VIBE_MULTI_Q04
  category: multi-hop
  query: How does the effectiveness of personalization when trying to convince a human AI compare with the effectiveness of the blank slate paradigm in enterprise web design at the meso level?
  golden_answer: According to an article on political persuasion, the value of personalization (taking into account the user's age, gender, ideology and personal reflections) was unexpectedly low - its average effect was only +0.43pp and never exceeded 1pp, falling far short of the scale of the model or a direct command to use facts. At the same time, at the meso-level of vibe coding in organizations, the “blank slate” paradigm, when the model generates code without a contextual link to the brand, is recognized as destructive and leading to the erosion of identity. Based on both fragments, we can conclude that microtargeting for a specific person is ineffective for AI, while “contextual anchoring” at the structure level (implementation of design systems, brand books) is critically necessary to overcome probabilistic AI defaults.
