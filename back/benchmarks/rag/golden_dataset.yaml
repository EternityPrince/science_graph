  query: Based on data from both papers, compare the performance of the base DeepSeek V3 model with its updated versions (DeepSeek V3.1 / DeepSeek-R1) in terms of resistance to hallucinations in long context and overall mathematical accuracy.
  golden_answer: 'In the Kamiwaza AI report, when testing Document Q&A on a 32K context, the base model DeepSeek V3 took only 17th place with an overall accuracy of 79.98% and a high level of fabrication of non-existent facts (28.87%). In contrast, the updated DeepSeek V3.1 showed a massive quantum leap, rising to 3rd place with an accuracy of 95.49% and a reduction in the fabrication rate to 6.35%. When scaling context to 128K, DeepSeek V3.1 remains highly stable, maintaining an accuracy of 90.45% (a drop of only 5.04 p.p.) and increasing hallucinations to only 7.71%. This progress correlates perfectly with DeepSeek-AI''s internal tests: their technical report notes that moving from the baseline architecture to DeepSeek-R1 (trained on top of DeepSeek-V3-Base) using large-scale RL increased performance on the challenging AIME 2024 math benchmark (Pass@1) from 39.2% (DeepSeek V3) to 79.8% (DeepSeek R1), proving that the targeted development of reasoning mechanisms through RL radically reduces
    the model’s propensity for errors and fabrications.'
