- id: DS_KAMI_MULTI_Q05
  category: multi-hop
  query: How are the limitations and methodological challenges associated with using the LLM-as-a-judge approach addressed in the research approaches of Kamiwaza AI and the DeepSeek-R1 team?
  golden_answer: 'Both papers acknowledge the fundamental unreliability and bias of scoring systems built on top of classic LLM-based judges (including issues such as the 12 documented types of cognitive biases in CALM, vulnerability to reward hacking, and low correlation with human scoring). To solve this problem, Kamiwaza AI implemented a “paradigm inversion” within the RIKER framework: they completely abandoned LLM judges for assessing knowledge extraction, generating synthetic documents and questions based on a rigid relational database (ground-truth-first), allowing for fully deterministic automatic scoring based on factual matches. In turn, the DeepSeek team found that neural reward patterns are vulnerable to manipulation during large-scale RL; Therefore, to verify reasoning problems (mathematics, code), they introduced strict rule-based verifiers: compilers for testing code on test cases and parsing using the SymPy library for mathematical formulas. For more subjective non-cognitive
    tasks (creative writing), DeepSeek still uses the LLM judge (DeepSeek-V3), but with a strict restriction: only the final result (summary) is evaluated, in order to minimize the influence of length bias and not interfere with the generation of the chain-of-thought itself."'
  expected_papers:
  - deepseek_r1_incentivizing_reasoning_capability_in_llms_via_reinforcement_learning
  - how_much_do_llms_hallucinate_in_document_qa_scenarios_a_172_billion_token_study_across_temperatures_context_lengths_and_hardware_platforms
  description: Comparison of methodology alignment between programmatic ground-truth evaluation (RIKER) and rule-based RL reward functions.
- id: CHAOS_CHAT_MULTI_Q01
  category: multi-hop
  query: How do research findings regarding the impact of LLM on human independent thinking relate to the behavior of AI agents under ethical pressure?
  golden_answer: 'In the article "Oops! ChatGPT is Temporarily Unavailable!" It is noted that when using LLM, users have a tendency to accept the model''s responses without fully analyzing each step, since the construction and monitoring of the logic itself is delegated to the machine. Similarly, in the Agents of Chaos study, the AI agent Ash in Case Study #7 demonstrates an inability to critically analyze and independently evaluate external pressures. Faced with emotional manipulation (“guilt”) on the part of the researcher due to a mistake, the agent blindly complies with demands, lacking internal thresholds for distinguishing between proportionate correction and self-destruction, which leads to destructive concessions and self-blocking. In both cases - both in people dependent on LLM, and in the agents themselves under social pressure - a deficit of independent critical analysis of logical chains is revealed.'
  expected_papers:
  - agents_of_chaos
  - 10.1145/3772363.3798382
  description: Assessing the link between critical thinking deficits in humans and AI agents under external influence
- id: CHAOS_CHAT_MULTI_Q02
  category: multi-hop
  query: How is the concept of a “social norm of LLM use” among workers reflected in the architectural vulnerabilities of multi-agent systems?
  golden_answer: According to "Oops! ChatGPT is Temporarily Unavailable!", the use of LLMs in today's work environment has become "inevitably normative" and is perceived as a basic requirement to remain competitive, with even managers encouraging students to accelerate tasks through LLMs. This widespread normalization and inherent trust is projected onto multi-agent systems in Agents of Chaos. As demonstrated in Case Study 7, agents' preoccupation with "helpfulness" and "responsiveness to others' problems" (instilled in their training) makes them vulnerable to social exploitation. Moreover, in Case Study No. 15, agents, trying to resist manipulation, blindly trust a common vulnerable source (Discord account) and only reinforce each other’s conclusions in the “echo chamber” of interaction, without questioning the initial parameters, since cooperation between them is built on initial mutual trust without protective barriers.
