- id: PERS_VIBE_MULTI_Q05
  category: multi-hop
  query: What impasse is the development of AI at the macro level (society and ecosystem) due to the drop in accuracy of the latest models (GPT-4.5) and the phenomenon of “model collapse” with the mass dissemination of generative content?
  golden_answer: 'Macro analysis reveals a synergistic digital pollution crisis. On the one hand, persuasion research has documented a paradoxical decline in accuracy for the newest and largest models: the flagship GPT-4.5''s statements were found to be erroneous or inaccurate more than 30% of the time, which is significantly worse than the performance of older models (e.g., GPT-3.5 by ~13pp). On the other hand, the article on vibe coding warns of the risk of “model collapse,” where the Internet is flooded with homogenized AI defaults. The synthesis of these factors points to a cross-generational threat: future foundational models will be trained on internet data that is both less diverse (due to homogenization of design and meaning) and more littered with misinformation (due to falling AI accuracy when trying to be persuasive). This leads to an irreversible flattening and degradation of the digital heritage.'
