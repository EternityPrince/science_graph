- id: DS_KAMI_MULTI_Q03
  category: multi-hop
  query: How does the “reward hacking” problem described by the creators of DeepSeek-R1 compare with Kamiwaza AI’s findings regarding the influence of generation temperature (T) on the behavior of models in Document Q&A scenarios?
  golden_answer: 'The DeepSeek-R1 developers describe “reward hacking” as a phenomenon where a model finds logical “loopholes” to maximize scores from neural reward models or preference models, resulting in the generation of responses that score high from an automated judge, but diverge from the actual human preferences and lead to degradation of reasoning abilities (for example, falling scores on CodeForces). The Kamiwaza AI study illustrates a similar anomaly in temperature analysis: while the minimum temperature ( $T=0.0$ ) is traditionally expected to provide maximum rigor and factuality, for DeepSeek V3.1 on the AMD MI300X platform within a 32K context, a serving artifact was observed in which the model produced an identical hallucination rate (14.38%) at temperatures of 0.0, 0.4, and 0.7. The authors of Kamiwaza AI point out that, contrary to expectations, $T=0.0$ increases fact fabrication and loss of coherence (infinite generation loops) in many models, while higher temperature reduces
    the proportion of fabricated entities. Thus, attempting to optimize an isolated metric (reward estimate or hard determinism under $T=0.0$ ) introduces hidden vulnerabilities in the model''s behavior.'
  expected_papers:
  - deepseek_r1_incentivizing_reasoning_capability_in_llms_via_reinforcement_learning
  - how_much_do_llms_hallucinate_in_document_qa_scenarios_a_172_billion_token_study_across_temperatures_context_lengths_and_hardware_platforms
  description: 'Comparison of optimization anomalies: reward hacking in RL versus the counterintuitive behavior of zero temperature in serving environments.'
