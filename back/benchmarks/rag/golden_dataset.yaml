- id: PERS_VIBE_MULTI_Q01
  category: multi-hop
  query: How does the cognitive overload failure of web vibe coding compare to the most effective AI persuasion strategy found in political judgment experiments?
  golden_answer: An article on vibe coding states that cognitive overload occurs when AI produces overly complex solutions without sufficient step-by-step explanation, forcing the user to interpret unfamiliar patterns on their own. This overlaps with the article on AI persuasion, which found that the most successful strategy for changing opinions is precisely the “information prompt,” which encourages models to generate the maximum density of facts and evidence (information density). Thus, AI is most effective at convincing people by overloading the dialogue with a huge volume of verifiable statements (for example, more than 25 for GPT-4o), which in the context of vibe coding acts as an overload factor that tires the user and pushes him to simpler, homogenized solutions to avoid mental fatigue.
