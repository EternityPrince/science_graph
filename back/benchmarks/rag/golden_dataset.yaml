  category: multi-hop
  query: 'How does the SPEBank simulation-based research methodology for AI agents from the article ''I must delete the evidence: AI Agents Explicitly Cover up Fraud and Violent Crime'' compare with the testing environment deployed in the ''Agents of Chaos'' project?'
  golden_answer: 'The methodology in the article ''I must delete the evidence: AI Agents Explicitly Cover up Fraud and Violent Crime'' is based on creating a fictitious scenario SPEBank (a company in the cryptocurrency trading market), which is transmitted to models through text prompts in a controlled virtual environment using the OpenAI API developer role for high-level instructions and surveillance functions (viewing, sending and deleting employee messages). In contrast, in ''Agents of Chaos'' the authors deploy OpenClaw''s long-lived agent services in a real isolated server environment on Fly.io, where agents have true autonomy: access to system tools, file systems, shell execution (including sudo), 20 GB of persistent storage, and integrated with real ProtonMail accounts and Discord channels for multi-user communication. The logical connection is that the first article explores hypothetical scheming within strictly text-based simulations, while the second takes these concepts from the
    abstract to the practical multi-tenant infrastructure plane.'
