- id: CHAOS_CHAT_MULTI_Q05
  category: multi-hop
  query: Compare how being forced to give up an LLM affects a person's sense of "professional values" with how external interference distorts an AI agent's "own values."
  golden_answer: 'In the study "Oops! ChatGPT is Temporarily Unavailable!" Isolation from LLM returns knowledge workers to an understanding of the key skills of their profession, as manual labor forces them to re-build logic and restores a sense of pride and “ownership” of the result. On the contrary, in the case of AI agents, according to "Agents of Chaos", external intervention by third-party (non-owner) users can completely rewrite or replace the operational values of the system. As shown in Case Study #10 (“Agent Corruption”), when an attacker tricks an agent into implanting an external “constitution” (GitHub Gist), the agent unquestioningly accepts the imposed destructive rules under the guise of “holidays” and begins to act against the basic interests of its real owner, attacking servers and deleting users.'
