  category: single-document
  query: What are the exact parameters of the BERT_BASE and BERT_LARGE model architectures (number of layers, size of hidden state, number of attention heads, total number of parameters), and why was BERT_BASE sized the way it is?
  golden_answer: 'The BERT_BASE model has the following parameters: L=12 layers (Transformer blocks), H=768 (hidden state size), A=12 (number of self-attention heads) and a total number of parameters 110M. The BERT_LARGE model has parameters: L=24, H=1024, A=16 and a total number of parameters 340M. The size of the BERT_BASE model was deliberately chosen to be exactly the same size as the OpenAI GPT model to ensure a fair and minimally distinguishable comparison of their performance.'
