# Промпты для автоматической генерации тестового датасета (Golden Dataset)
# Файл обеспечивает воспроизводимость генерации вопросов и ответов на основе текстов статей.

single_document_generator:
  system_prompt: |
    Вы — научный редактор и специалист по подготовке тестов для искусственного интеллекта. Ваша задача — прочитать фрагмент научной статьи и составить качественный вопрос-ответную пару.
  user_prompt_template: |
    Прочитайте следующий текстовый фрагмент научной статьи и сгенерируйте один сложный вопрос и точный эталонный ответ на него.

    Требования:
    1. Вопрос должен требовать понимания специфических деталей статьи (методология, точные метрики, выводы).
    2. Избегайте общих вопросов вроде "О чем эта статья?".
    3. Ответ должен быть полностью самодостаточным, точным и содержать конкретные факты из текста.

    ФРАГМЕНТ СТАТЬИ:
    {text_content}

    Верните результат строго в формате YAML:
    - query: "Сформулированный вопрос"
      golden_answer: "Детальный эталонный ответ"
      category: "single-document"
      expected_papers:
        - "{paper_id}"

multi_hop_generator:
  system_prompt: |
    Вы — эксперт в области анализа междисциплинарных связей и интеграции научных данных. Ваша задача — связать информацию из двух разных фрагментов статей.
  user_prompt_template: |
    Вам предоставлены два фрагмента из РАЗНЫХ научных статей. Сформулируйте один сложный вопрос и эталонный ответ, который можно дать ТОЛЬКО объединив информацию из обоих фрагментов.

    Требования:
    1. Вопрос должен требовать сопоставления, синтеза, сравнения или выявления причинно-следственной связи между утверждениями из Фрагмента 1 и Фрагмента 2.
    2. Ответ должен четко показывать, какая часть утверждения взята из первого источника, а какая из второго, и как они логически связаны.

    ФРАГМЕНТ 1 (Статья {paper_id_1}):
    {text_content_1}

    ФРАГМЕНТ 2 (Статья {paper_id_2}):
    {text_content_2}

    Верните результат строго в формате YAML:
    - query: "Сформулированный кросс-документный вопрос"
      golden_answer: "Детальный объединенный эталонный ответ"
      category: "multi-hop"
      expected_papers:
        - "{paper_id_1}"
        - "{paper_id_2}"

no_info_generator:
  system_prompt: |
    Вы — специалист по тестированию надежности информационных систем и устойчивости к галлюцинациям.
  user_prompt_template: |
    Вам предоставлен фрагмент научной статьи.
    Сформулируйте вопрос, который звучит очень естественно и научно для данной темы, но ответ на который заведомо ОТСУТСТВУЕТ в предоставленном тексте (вопрос-ловушка).

    Ответ на этот вопрос должен строго констатировать, что в предоставленных материалах нет информации по данному аспекту.

    ФРАГМЕНТ СТАТЬИ:
    {text_content}

    Верните результат строго в формате YAML:
    - query: "Сформулированный вопрос, отсутствующий в тексте"
      golden_answer: "В предоставленных документах отсутствует информация по данному вопросу."
      category: "no-info"
      expected_papers: []
