# Промпты для анализа результатов тестирования RAG-системы
# Эти промпты копируются в буфер обмена вместе со сводными метриками.

templates:
  analyze_run_ru:
    name: "Анализ результатов запуска RAG (Подробный)"
    description: "Детальный анализ метрик качества, выявление сильных/слабых сторон базлайнов и рекомендации по улучшению."
    system_prompt: "Вы — ведущий архитектор RAG-систем и эксперт по оптимизации поиска информации (IR)."
    user_prompt_template: |
      Привет! Я провел тестирование качества RAG-системы на золотом датасете. Вот результаты этого запуска (из отчета по метрикам):

      === НАЧАЛО ДАННЫХ ОТЧЕТА ===
      {metrics_summary}
      === КОНЕЦ ДАННЫХ ОТЧЕТА ===

      Проанализируй эти результаты и подготовь структурированный отчет со следующими разделами:
      1. **Краткое резюме**: Основные выводы по качеству (кто лидер, кто аутсайдер, какие общие тенденции).
      2. **Анализ базлайнов**:
         - Сравни чисто лексический (B1) и чисто векторный (B2) поиск. В чем разница по метрикам и почему?
         - Какое влияние оказал HyDE (B3)? Помог он или ухудшил результаты по сравнению с чистыми векторами (B2)?
         - Как себя показал гибридный поиск (B4) и граф-RAG (B5)?
         - Проанализируй поведение полного пайплайна (B6). Если его результаты хуже, чем у более простых конфигураций (например, B2 или B4), детально объясни, какие компоненты (реранкер, классификатор интентов, адаптивный граф) могли внести шум или ошибки.
      3. **Анализ метрик**:
         - Посмотри на баланс между Retrieval Recall и Context Precision. Достаточно ли релевантен контекст?
         - Оцени Faithfulness (насколько ответы основаны на контексте) и Answer Relevance (насколько они соответствуют вопросу). Есть ли признаки галлюцинаций или ухода от темы?
         - Проанализируй Citation Fidelity. Умеет ли система правильно ссылаться на источники?
      4. **Конкретные рекомендации по улучшению**: Предложи 3-5 конкретных инженерных изменений в архитектуру (настройки реранкера, порогов фильтрации, параметров обхода графа, промптов генерации), чтобы повысить общую точность (Semantic Accuracy).

  diagnose_b6_ru:
    name: "Диагностика деградации B6 (Full Pipeline)"
    description: "Специальный промпт для разбора причин, почему полный пайплайн с графами работает хуже простых вариантов."
    system_prompt: "Вы — эксперт по отладке сложных RAG-пайплайнов и графовых баз данных."
    user_prompt_template: |
      Привет! Во время тестирования RAG-системы мы заметили, что полный пайплайн B6 (Full Pipeline) показывает результаты хуже, чем стандартный гибрид B4 или векторный поиск B2.
      
      Вот детальные метрики этого запуска:
      
      === НАЧАЛО ДАННЫХ ОТЧЕТА ===
      {metrics_summary}
      === КОНЕЦ ДАННЫХ ОТЧЕТА ===
      
      Помоги разобраться, почему B6 деградирует. Проанализируй данные и ответь на вопросы:
      1. Какая метрика просела сильнее всего у B6 по сравнению с B4/B2? (Например, Recall, Precision, Faithfulness или Semantic Accuracy).
      2. Какие из 12 компонентов B6 (классификатор намерения, расширение запроса, адаптивный обход графа с geometric decay, реранкер Cross-Encoder, фильтрация фактов через LLM) с наибольшей вероятностью вызывают эту просадку и по какому механизму?
      3. Как на деградацию влияет задержка (Latency)? B6 работает значительно дольше — связано ли это с избыточными вызовами LLM или поиском по графу?
      4. Напиши план действий (Action Plan) из 4 шагов для локализации проблемы и её исправления.

  compare_runs_ru:
    name: "Сравнение двух запусков RAG (A/B анализ)"
    description: "Сравнительный анализ двух разных запусков, чтобы увидеть влияние изменений в коде или моделях."
    system_prompt: "Вы — специалист по анализу данных и оптимизации RAG-систем."
    user_prompt_template: |
      Привет! Я хочу сравнить результаты двух запусков тестирования RAG-системы, чтобы оценить влияние внесенных изменений.

      Вот результаты Запуска 1 (Исходный / Контрольный):
      === НАЧАЛО ДАННЫХ ЗАПУСКА 1 ===
      {metrics_summary_1}
      === КОНЕЦ ДАННЫХ ЗАПУСКА 1 ===

      Вот результаты Запуска 2 (Новый / Экспериментальный):
      === НАЧАЛО ДАННЫХ ЗАПУСКА 2 ===
      {metrics_summary_2}
      === КОНЕЦ ДАННЫХ ЗАПУСКА 2 ===

      Проведи сравнительный анализ и ответь:
      1. **Общий прогресс**: Стали ли результаты экспериментального запуска лучше? Сравни средние показатели по ключевым метрикам (Recall, Precision, Faithfulness, Semantic Accuracy, Latency).
      2. **Побазлайновый анализ**: По каким конфигурациям (B0-B6) произошли наиболее заметные улучшения или ухудшения?
      3. **Сложные запросы**: Изменилось ли поведение на топ-сложных запросах?
      4. **Вывод**: Рекомендуешь ли ты внедрять изменения из Запуска 2 в продакшн? Обоснуй ответ на основе метрик.

  short_summary_en:
    name: "Short Executive Summary (English)"
    description: "Generate a concise executive summary and key takeaways of the run."
    system_prompt: "You are a senior technical writer specializing in AI & Search systems."
    user_prompt_template: |
      Here are the quality metrics from our RAG benchmarking pipeline:

      === RUN METRICS ===
      {metrics_summary}
      === END OF METRICS ===

      Provide a concise executive summary of this run:
      - Key achievements (which configuration is the best and by how much)
      - Major issues identified
      - Recommended next steps for the engineering team
