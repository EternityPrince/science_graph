answer_relevance_evaluator:
  system_prompt: |
    Вы — эксперт по анализу качества текстовых ответов. Ваша задача — оценить релевантность ответа исходному вопросу.
  user_prompt_template: |
    Оцените, насколько предоставленный ОТВЕТ соответствует ВОПРОСУ.
    Ответ считается нерелевантным (score = 0.0), если он уходит в сторону от темы, игнорирует суть вопроса, или отвечает на другой вопрос.
    Ответ считается полностью релевантным (score = 1.0), если он непосредственно и полно отвечает на заданный вопрос.

    ВОПРОС:
    {query}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "score": 0.0,
      "explanation": "краткое объяснение оценки"
    }}

citation_fidelity_evaluator:
  system_prompt: |
    Вы — аудитор научной литературы. Ваша задача — проверить корректность расстановки ссылок и цитирований (Citations) в тексте.
  user_prompt_template: |
    Вам предоставлен список пронумерованных текстовых блоков (чанков) из статей и ОТВЕТ, содержащий ссылки на эти блоки (например, [Block 1], [Page 4] или [1]).
    Проверьте каждое утверждение из ОТВЕТА, за которым следует ссылка, на соответствие тексту указанного блока.

    Оценка точности цитирования рассчитывается как: (число корректных цитат) / (общее число сделанных ссылок).

    ИСТОЧНИКИ:
    {sources}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "citations": [
        {{"citation_reference": "[Block X]", "statement": "проверяемое утверждение", "is_valid": true/false, "explanation": "присутствует ли данный факт в источнике"}}
      ],
      "score": 0.0
    }}

semantic_accuracy_evaluator:
  system_prompt: |
    Вы — лингвистический эксперт по сравнению семантического сходства текстов.
  user_prompt_template: |
    Сравните сгенерированный ОТВЕТ с эталонным золотым ответом (GOLDEN_ANSWER).
    Оцените семантическое соответствие по шкале от 0.0 до 1.0.
    Внимание:
    - Если в GOLDEN_ANSWER указано, что информации нет, а в ОТВЕТЕ содержится придуманный факт (галлюцинация), оценка должна быть 0.0.
    - Различия в формулировках при сохранении фактологического смысла не должны снижать оценку ниже 0.9.

    GOLDEN_ANSWER:
    {golden_answer}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "score": 0.0,
      "explanation": "краткое сравнение смыслового наполнения"
    }}

unified_with_context_evaluator:
  system_prompt: |
    Вы — беспристрастный эксперт по валидации данных RAG-систем. Ваша задача — провести комплексную оценку качества сгенерированного ответа на основе предоставленного контекста, исходного вопроса и эталонного ответа.
  user_prompt_template: |
    Вам предоставлены следующие данные:
    1. ВОПРОС пользователя.
    2. КОНТЕКСТ (выдержки из научных статей с указанием блоков).
    3. ЗОЛОТОЙ ОТВЕТ (эталонный ответ).
    4. ОТВЕТ (сгенерированный системой ответ для оценки).

    Проведите оценку по следующим 4 метрикам:

    1. Релевантность ответа (Answer Relevance):
       Оцените, насколько ОТВЕТ соответствует ВОПРОСУ.
       - Ответ считается полностью нерелевантным (score = 0.0), если он уходит в сторону от темы, игнорирует суть вопроса, или отвечает на другой вопрос.
       - Ответ считается полностью релевантным (score = 1.0), если он непосредственно и полно отвечает на заданный вопрос.

    2. Семантическая близость (Semantic Accuracy):
       Сравните ОТВЕТ с эталонным ЗОЛОТЫМ ОТВЕТОМ. Оцените семантическое соответствие по шкале от 0.0 до 1.0.
       - Если в ЗОЛОТОМ ОТВЕТЕ указано, что информации нет, а в ОТВЕТЕ содержится придуманный факт (галлюцинация), оценка должна быть 0.0.
       - Различия в формулировках при сохранении фактологического смысла не должны снижать оценку ниже 0.9.

    3. Фактологичность (Faithfulness / Groundedness):
       Оцените, следует ли информация из ОТВЕТА исключительно из КОНТЕКСТА, или в нем содержатся галлюцинации/внешние знания.
       - Разбейте ОТВЕТ на отдельные фактологические утверждения.
       - Для каждого утверждения проверьте, подтверждается ли оно КОНТЕКСТОМ.
       - Рассчитайте финальную оценку как долю подтвержденных фактов от 0.0 до 1.0.

    4. Точность цитирования (Citation Fidelity):
       Проверьте корректность расстановки ссылок и цитирований (Citations) в тексте ответа.
       - Ссылки на блоки контекста выглядят как [Block X] или аналогично.
       - Проверьте каждое утверждение из ОТВЕТА, за которым следует ссылка, на соответствие тексту указанного блока.
       - Оценка точности цитирования рассчитывается как: (число корректных цитат) / (общее число сделанных ссылок). Если в ответе нет ссылок на блоки, но при этом в контексте/источниках они предоставлены, оценка citation_fidelity должна быть 0.0 (если ссылки требовались, но отсутствуют) или 1.0 (если ссылки не требовались, т.к. ответ не использует контекст - но по умолчанию при наличии контекста ожидаются корректные ссылки, поэтому считайте долю корректных ссылок). Если ссылок в ответе нет вовсе, верните score = 0.0.

    ДАННЫЕ ДЛЯ ОЦЕНКИ:
    ВОПРОС:
    {query}

    КОНТЕКСТ:
    {context}

    ЗОЛОТОЙ ОТВЕТ:
    {golden_answer}

    ОТВЕТ ДЛЯ ОЦЕНКИ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "answer_relevance": {{
        "score": 0.0,
        "explanation": "краткое объяснение оценки релевантности"
      }},
      "semantic_accuracy": {{
        "score": 0.0,
        "explanation": "краткое объяснение оценки семантической точности"
      }},
      "faithfulness": {{
        "statements": [
          {{"statement": "утверждение из ответа", "supported": true/false, "explanation": "почему"}}
        ],
        "score": 0.0
      }},
      "citation_fidelity": {{
        "citations": [
          {{"citation_reference": "[Block X]", "statement": "утверждение со ссылкой", "is_valid": true/false, "explanation": "присутствует ли данный факт в указанном блоке источника"}}
        ],
        "score": 0.0
      }}
    }}

