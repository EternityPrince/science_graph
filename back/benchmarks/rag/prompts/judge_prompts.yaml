  system_prompt: |
    Вы — беспристрастный эксперт по валидации данных RAG-систем. Ваша задача — оценить степень фактологичности (Groundedness / Faithfulness) сгенерированного ответа на основе предоставленного контекста.
  user_prompt_template: |
    Вам предоставлен КОНТЕКСТ (выдержки из научных статей) и ОТВЕТ на вопрос.
    Определите, следует ли информация из ОТВЕТА исключительно из КОНТЕКСТА, или в нем содержатся галлюцинации/внешние знания.

    Инструкции:
    1. Разбейте ОТВЕТ на отдельные фактологические утверждения.
    2. Для каждого утверждения проверьте, подтверждается ли оно КОНТЕКСТОМ.
    3. Выведите JSON со списком утверждений, вердиктом (true/false) для каждого и финальной оценкой (доля подтвержденных фактов от 0.0 до 1.0).

    КОНТЕКСТ:
    {context}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "statements": [
        {{"statement": "утверждение", "supported": true/false, "explanation": "почему"}}
