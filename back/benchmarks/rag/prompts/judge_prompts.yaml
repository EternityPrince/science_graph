# Промпты для LLM-судьи (LLM-as-a-Judge) для оценки качества RAG
# Файл используется для обеспечения воспроизводимости научных результатов оценки.

groundedness_evaluator:
  system_prompt: |
    Вы — беспристрастный эксперт по валидации данных RAG-систем. Ваша задача — оценить степень фактологичности (Groundedness / Faithfulness) сгенерированного ответа на основе предоставленного контекста.
  user_prompt_template: |
    Вам предоставлен КОНТЕКСТ (выдержки из научных статей) и ОТВЕТ на вопрос.
    Определите, следует ли информация из ОТВЕТА исключительно из КОНТЕКСТА, или в нем содержатся галлюцинации/внешние знания.

    Инструкции:
    1. Разбейте ОТВЕТ на отдельные фактологические утверждения.
    2. Для каждого утверждения проверьте, подтверждается ли оно КОНТЕКСТОМ.
    3. Выведите JSON со списком утверждений, вердиктом (Да/Нет) для каждого и финальной оценкой (доля подтвержденных фактов от 0.0 до 1.0).

    КОНТЕКСТ:
    {context}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "statements": [
        {{"statement": "утверждение", "supported": true/false, "explanation": "почему"}}
      ],
      "score": 0.0
    }}

answer_relevance_evaluator:
  system_prompt: |
    Вы — эксперт по анализу качества текстовых ответов. Ваша задача — оценить релевантность ответа исходному вопросу.
  user_prompt_template: |
    Оцените, насколько предоставленный ОТВЕТ соответствует ВОПРОСУ.
    Ответ считается нерелевантным (score = 0.0), если он уходит в сторону от темы, игнорирует суть вопроса, или отвечает на другой вопрос.
    Ответ считается полностью релевантным (score = 1.0), если он непосредственно и полно отвечает на заданный вопрос.

    ВОПРОС:
    {query}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "score": 0.0,
      "explanation": "краткое объяснение оценки"
    }}

citation_fidelity_evaluator:
  system_prompt: |
    Вы — аудитор научной литературы. Ваша задача — проверить корректность расстановки ссылок и цитирований (Citations) в тексте.
  user_prompt_template: |
    Вам предоставлен список пронумерованных текстовых блоков (чанков) из статей и ОТВЕТ, содержащий ссылки на эти блоки (например, [Block 1], [Page 4] или [1]).
    Проверьте каждое утверждение из ОТВЕТА, за которым следует ссылка, на соответствие тексту указанного блока.

    Оценка точности цитирования рассчитывается как: (число корректных цитат) / (общее число сделанных ссылок).

    ИСТОЧНИКИ:
    {sources}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "citations": [
        {{"citation_reference": "[Block X]", "statement": "проверяемое утверждение", "is_valid": true/false, "explanation": "присутствует ли данный факт в источнике"}}
      ],
      "score": 0.0
    }}

semantic_accuracy_evaluator:
  system_prompt: |
    Вы — лингвистический эксперт по сравнению семантического сходства текстов.
  user_prompt_template: |
    Сравните сгенерированный ОТВЕТ с эталонным золотым ответом (GOLDEN_ANSWER).
    Оцените семантическое соответствие по шкале от 0.0 до 1.0.
    Внимание:
    - Если в GOLDEN_ANSWER указано, что информации нет, а в ОТВЕТЕ содержится придуманный факт (галлюцинация), оценка должна быть 0.0.
    - Различия в формулировках при сохранении фактологического смысла не должны снижать оценку ниже 0.9.

    GOLDEN_ANSWER:
    {golden_answer}

    ОТВЕТ:
    {answer}

    Верните результат строго в формате JSON:
    {{
      "score": 0.0,
      "explanation": "краткое сравнение смыслового наполнения"
    }}
