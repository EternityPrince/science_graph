- id: WIN_SINGLE_Q01
  query: Каким образом в статье адаптируется классический метод Винограда для вейвлет-фильтрации
    с децимацией, какие конкретно базовые конфигурации обеспечили наилучшую эффективность
    по метрике площади-задержки и каковы итоговые показатели снижения вычислительной
    задержки?
  category: single-document
  golden_answer: "Классический метод Винограда ориентирован на вычисление групп соседних\
    \ пикселей, что не учитывает операцию децимации (понижения частоты дискретизации),\
    \ характерную для вейвлет-преобразований. Для адаптации предложен обобщенный метод\
    \ $K(a,q,s)$, где входной поток данных разделяется на четные и нечетные группа\
    \ отсчетов, а вычисления разбиваются на параллельные каналы. В общем случае фильтрация\
    \ с уменьшением частоты дискретизации в $s$ раз описывается как $K(a,q,s) = b_2\
    \ \\times K(a,b_1+1) + (s-b_2) \\times K(a,b_1)$, где $b_1$ и $b_2$ — неполное\
    \ частное и остаток от деления порядка вейвлет-фильтра $q$ на шаг децимации $s$.\
    \ \n\nВ ходе аппаратного моделирования на FPGA семейства Virtex 7 наилучшую эффективность\
    \ по произведению «площадь-задержка» продемонстрировали конфигурации $K(3,4,2)$\
    \ для вейвлет-фильтров 4-го порядка и $K(5,6,2)$ для фильтров 6-го порядка. Применение\
    \ метода Винограда позволило снизить вычислительную задержку на 34–63% для вейвлетов\
    \ 4-го порядка и на 39–66% для вейвлетов 6-го порядка по сравнению с прямым методом."
