        """

        Sodium Sodium is the major cation of the extracellular fluid. It is responsible
        for one-half of the osmotic pressure gradient that exists between the interior
        of cells and their surrounding environment. People eating a typical Western
        diet, which is very high in NaCl, routinely take in 130 to 160 mmol/day of
        sodium, but humans require only 1 to 2 mmol/day. This excess sodium appears
        to be a major factor in hypertension (high blood pressure) in some people.
        Excretion of sodium is accomplished primarily by the kidneys. Sodium is freely
        filtered through the glomerular capillaries of the kidneys, and although much
        of the filtered sodium is reabsorbed in the proximal convoluted tubule, some
        remains in the filtrate and urine, and is normally excreted. Hyponatremia
        is a lower-than-normal concentration of sodium, usually associated with excess
        water accumulation in the body, which dilutes the sodium. An absolute loss
        of sodium may be due to a decreased intake of the ion coupled with its continual
        excretion in the urine. An abnormal loss of sodium from the body can result
        from several conditions, including excessive sweating, vomiting, or diarrhea;
        the use of diuretics; excessive production of urine, which can occur in diabetes;
        and acidosis, either metabolic acidosis or diabetic ketoacidosis. A relative
        decrease in blood sodium can occur because of an imbalance of sodium in one
        of the body’s other fluid compartments, like IF, or from a dilution of sodium
        due to water retention related to edema or congestive heart failure. At the
        cellular level, hyponatremia results in increased entry of water into cells
        by osmosis, because the concentration of solutes within the cell exceeds the
        concentration of solutes in the now-diluted ECF. The excess water causes swelling
        of the cells; the swelling of red blood cells—decreasing their oxygen-carrying
        efficiency and making them potentially too large to fit through capillaries—along
        with the swelling of neurons in the brain can result in brain damage or even
        death. Hypernatremia is an abnormal increase of blood sodium. It can result
        from water loss from the blood, resulting in the hemoconcentration of all
        blood constituents. Hormonal imbalances involving ADH and aldosterone may
        also result in higher-than-normal sodium values.

