          вычисле- ние групп соседних значений, в то вре- мя как при вейвлет-фильтрации
          исполь- зуется операция децимации, заключа- ющаяся в уменьшении частоты
          дискре- тизации. Данное обстоятельство требу- ет адаптации и обобщения метода
          Ви- нограда для задач с понижающей дискре- тизацией сигнала с коэффициентом
          2, ха- рактерной для вейвлет-преобразований изображений. Цель настоящего
          исследования за- ключается в снижении вычислительной задержки и повышении
          скорости обра- ботки изображений при использовании вейвлет-фильтров на основе
          применения модифицированного метода Винограда для высокоскоростной реализации
          одно- мерной фильтрации с децимацией. Оставшаяся часть статьи организо-
          вана следующим образом. В разделе 2 излагается предложенный метод реали-
          зации вейвлет-обработки изображений на основе метода Винограда.
        score: 0.0328
      - id: 10.21869/2223-1560-2025-29-2-130-145#1
        paper_id: 10.21869/2223-1560-2025-29-2-130-145
        page_number: 1
        text_content: 'Указанное обстоя- тельство требует разработки вычислительно
          эффективных алгоритмов вейвлет-обработки, пригодных для реализации в составе
          современных вычислительных устройств. Данное исследование направлено на
          снижение вычислительной сложности выполнения вейвлет обработки изображений
          на основе использования модифи- кации метода Винограда. В статье предлагается
          применение нового подхода для организации вычислений при одномерной фильтрации
          с децимацией. Методы. В исследовании применялся метод организации вычислений
          на основе преобразования Виногра- да и аппаратное моделирование на программируемой
          вентильной матрице в среде Xilinx Vivado 2018.2 с использованием языка Verilog
          для семейства Virtex 7 модель «xc7vx485tffg1157-1», с применением стан-
          дартных параметров синтеза и реализации: «Vivado Synthesis Defaults» и «Vivado
          Implementation Defaults» соответственно. Результаты.'
