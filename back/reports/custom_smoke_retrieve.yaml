      enrichment_block: "[Paper] Increasing the speed of wavelet image processing\
        \ based on the Winograd method taking into account decimation: Title: Increasing\
        \ the speed of wavelet image processing based on the Winograd method taking\
        \ into account decimation. Abstract: Purpose of research. Wavelet transform\
        \ is widely used to solve a wide range of digital image processing problems\
        \ in various applied and scientific and technical fields. At the same time,\
        \ modern visual information processing systems face the problem of insufficient\
        \ performance against the background of a rapid increase in digital data volumes.\
        \ This circumstance requires the development of computationally efficient\
        \ wavelet processing algorithms suitable for implementation in modern computing\
        \ devices. This study is aimed at reducing the computational complexity of\
        \ wavelet image processing based on the use of a modification of the Winograd\
        \ method. The article proposes the use of a new approach to organizing calculations\
        \ for one-dimensional filtering with decimation.Methods. The study used a\
        \ method for organizing calculations based on the Winograd transform and hardware\
        \ simulation on a programmable valve matrix in Xilinx Vivado 2018.2 environment\
        \ using Verilog language for Virtex 7 family model “xc7vx485tffg1157-1”, using\
        \ standard synthesis and implementation parameters: “Vivado Synthesis Defaults”\
        \ and “Vivado Implementation Defaults”, respectively.Results. Experimental\
        \ modeling of the wavelet transform has demonstrated that the application\
        \ of the Winograd method in wavelet image processing tasks allows for a reduction\
        \ the computational delay by 34-63% compared to the direct method when using\
        \ fourth-order wavelets and by 39-66% when using sixth-order wavelets.Conclusion.\
        \ The application of the Winograd method provides a significant increase in\
        \ the computation speed with some increase in hardware complexity and energy\
        \ consumption. The results of the study can find wide application in modern\
        \ signal, image and video processing systems, as well as in the development\
        \ of machine learning systems.. Summary: ## Summary  \n\n**Title & Author**\
        \  \n- *Increasing the Speed of Wavelet Image Processing Based on the Winograd\
        \ Method Taking into Account Decimation* – Pavel A. Lyakhov, North‑Caucasus\
        \ Federal University  \n\n**Purpose**  \nDevelop computationally efficient\
        \ wavelet‑image‑processing algorithms to address the performance demands of\
        \ rapidly growing digital data volumes.  \n\n**Key Contributions**  \n- Demonstrated\
        \ a **34–66 % reduction in computational delay** when applying the Winograd\
        \ method to fourth‑order and sixth‑order wavelets, respectively.  \n- Introduced\
        \ a **new algorithmic framework for organizing one‑dimensional filtering with\
        \ decimation**.  \n- Highlighted the trade‑off: **significant speedup with\
        \ modest increases in hardware complexity and energy consumption**.  \n\n\
        **Methodology**  \n- Implemented Winograd‑transform calculations in hardware\
        \ using **Xilinx Vivado 2018.2** and **Verilog** for a Virtex‑7 model (`xc7vx485tffg1157-1`).\
        \  \n- Employed standard synthesis and implementation settings (`Vivado Synthesis\
        \ Defaults`, `Vivado Implementation Defaults`).  \n- Compared results against\
        \ a direct wavelet‑processing approach for both wavelet orders.  \n\n**Findings**\
        \  \n- The Winograd approach **substantially accelerates wavelet processing**\
        \ (34–66 % faster).  \n- Suitable for modern **signal, image, video, and machine‑learning**\
        \ processing systems.  \n\n**Implications**  \nProvides a practical pathway\
        \ to enhance the performance of wavelet‑based image processing pipelines in\
        \ contemporary and future computational platforms.  \n\n**Keywords**  \nparallel\
        \ computing; digital image processing; discrete wavelet transform; Winograd\
        \ method; hardware implementation of digital filters. (Связь: Initial search\
        \ result)\n[Chunk] Increasing the speed of wavelet image processing based\
        \ on the Winograd method taking into account decimation (Page 4): Классическая\
        \ формулировка метода Винограда ориентирована на вычисле- ние групп соседних\
        \ значений, в то вре- мя как при вейвлет-фильтрации исполь- зуется операция\
        \ децимации, заключа- ющаяся в уменьшении частоты дискре- тизации. Данное\
        \ обстоятельство требу- ет адаптации и обобщения метода Ви- нограда для задач\
        \ с понижающей дискре- тизацией сигнала с коэффициентом 2, ха- рактерной для\
        \ вейвлет-преобразований изображений. Цель настоящего исследования за- ключается\
        \ в снижении вычислительной задержки и повышении скорости обра- ботки изображений\
        \ при использовании вейвлет-фильтров на основе применения модифицированного\
        \ метода Винограда для высокоскоростной реализации одно- мерной фильтрации\
        \ с децимацией. Оставшаяся часть статьи организо- вана следующим образом.\
        \ В разделе 2 излагается предложенный метод реали- зации вейвлет-обработки\
        \ изображений на основе метода Винограда.\n[Chunk] Increasing the speed of\
        \ wavelet image processing based on the Winograd method taking into account\
        \ decimation (Page 12): Кроме того, полученный результат мо- жет помочь в\
        \ создании систем обработ- ки изображений и видео в реальном времени. Выводы\
        \ В статье предложен новый подход к вейвлет-фильтрации изображений с де- цимацией\
        \ на основе метода Винограда, который адаптирован для обработки сигналов с\
        \ понижающей дискретизаци- ей и произвольным шагом. Аппаратное моделирование\
        \ вейвлет-фильтрации на FPGA показало, что предложенное ре- шение позволяет\
        \ снизить вычислитель- ную задержку до 63% для вейвлет- фильтров 4 порядка\
        \ и до 66% для вейв- лет-фильтров 6 порядка. Наилучшее со- отношение между\
        \ площадью и задержкой устройства продемонстрировали конфи- гурации метода\
        \ Винограда K (3,4,2) при использовании вейвлет-фильтров 4 по- рядка и K (5,6,2)\
        \ при использовании вейвлет-фильтров 6-го порядка. Полученный результат будет\
        \ вос- требован для практического примене- ния в области цифровой обработки\
        \ сиг- налов, изображений и видео.\n[Chunk] Increasing the speed of wavelet\
        \ image processing based on the Winograd method taking into account decimation\
        \ (Page 1): Указанное обстоя- тельство требует разработки вычислительно эффективных\
        \ алгоритмов вейвлет-обработки, пригодных для реализации в составе современных\
        \ вычислительных устройств. Данное исследование направлено на снижение вычислительной\
        \ сложности выполнения вейвлет обработки изображений на основе использования\
        \ модифи- кации метода Винограда. В статье предлагается применение нового\
        \ подхода для организации вычислений при одномерной фильтрации с децимацией.\
        \ Методы. В исследовании применялся метод организации вычислений на основе\
        \ преобразования Виногра- да и аппаратное моделирование на программируемой\
        \ вентильной матрице в среде Xilinx Vivado 2018.2 с использованием языка Verilog\
        \ для семейства Virtex 7 модель «xc7vx485tffg1157-1», с применением стан-\
