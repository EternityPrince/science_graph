      enrichment_block: "[Paper] Increasing the speed of wavelet image processing\
        \ based on the Winograd method taking into account decimation: Title: Increasing\
        \ the speed of wavelet image processing based on the Winograd method taking\
        \ into account decimation. Abstract: Purpose of research. Wavelet transform\
        \ is widely used to solve a wide range of digital image processing problems\
        \ in various applied and scientific and technical fields. At the same time,\
        \ modern visual information processing systems face the problem of insufficient\
        \ performance against the background of a rapid increase in digital data volumes.\
