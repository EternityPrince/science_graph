[project]
name = "graph"
version = "0.1.0"
description = "Graph-based scientific paper analyzer with RAG, auto-reviews and Web UI"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    # EPUB parsing
    "ebooklib>=0.18",
    # Local LLM inference (Apple Silicon MLX)
    "mlx-lm>=0.13.0",
    # Local LLM inference (GGUF via llama.cpp)
    "llama-cpp-python>=0.2.77",
    # Embeddings + reranker
    "sentence-transformers>=2.7.0",
    # CLI
    "typer>=0.12.0",
    # Config
    "pyyaml>=6.0.0",
    # Numerics
    "numpy>=1.26.0",
    # Graph algorithms
    "networkx>=3.0",
    # Vector index
    "usearch>=2.9.0",
    # Rich terminal output / TUI
    "rich>=13.0.0",
    # Web UI backend
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # SSE streaming
    "sse-starlette>=1.8.0",
    # Markdown front-matter parsing
    "python-frontmatter>=1.1.0",
    # OpenAI compatible API support
    "openai>=1.12.0",
    # Anti-detect browser and HTML parsing
    "curl-cffi>=0.7.0",
    "markdownify>=0.11.6",
    "beautifulsoup4>=4.12.0",
    # TUI
    "prompt-toolkit>=3.0.0",
    # tool kit for prepocessing
    "spacy>=3.8.14",
    "lm-format-enforcer>=0.11.3",
    # Video Ingestion & local Whisper
    "yt-dlp>=2024.3.10",
    "faster-whisper>=1.0.1",
    # MCP-connector
    "fastmcp>=0.4.1",
    "tiktoken>=0.13.0",
    "rank-bm25>=0.2.2",
    "transformers>=4.48.0",
    "marker-pdf==0.1.3",
    "torchvision>=0.27.0",
]

[project.scripts]
graph = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.5.0",
    "pytest-bdd>=7.0.0",
]
